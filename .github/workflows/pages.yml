# Runs the test suite on every push / PR, and deploys to GitHub Pages from main.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Tests: a newer push to the same branch cancels the older test run.
# (The deploy job below has its own, non-cancelling queue.)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm test

  deploy:
    needs: test
    # Pages accepts one deployment at a time. Queue deploys instead of cancelling a
    # running one (cancelling mid-deploy is what makes the next request fail).
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the files the site needs (not node_modules, tests, ...).
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js icons _site/
          # Stamp commit time + hash, add ?v=<hash> to css/js, version the service worker.
          node scripts/stamp.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true # a conflicting deployment is retried below
      - name: Wait, then retry the deployment once
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
