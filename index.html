<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sudoku</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sudoku" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="top">
        <div class="seg" id="diff">
          <button data-d="easy">Easy</button><button data-d="medium" class="on">Medium</button
          ><button data-d="hard">Hard</button>
        </div>
        <div class="tmr">
          <span id="tm">0:00</span><button id="pz" class="ib" aria-label="Pause"></button>
        </div>
        <div class="hdr-r">
          <button id="gear" class="ib" aria-label="Settings" aria-expanded="false">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg></button
          ><button id="hint" class="ib q" aria-label="Hint">?</button>
        </div>
      </div>
      <div id="board"></div>
      <div class="controls">
        <div class="tools">
          <button id="undo"><b>&#8630;</b>Undo</button>
          <button id="redo"><b>&#8631;</b>Redo</button>
          <button id="erase"><b>&#9003;</b>Erase</button>
          <button id="note"><b>&#9998;</b>Notes</button>
          <button id="auto" title="Fill every empty cell with its possible candidates">
            <b>&#9638;</b>Auto
          </button>
        </div>
        <div id="pad"></div>
      </div>
      <div id="msg"></div>
      <footer id="build" data-commit="__COMMIT_TIME__" data-sha="__COMMIT_SHA__"></footer>
    </div>
    <div id="menu" role="menu">
      <div class="row stat"><span id="mist">Mistakes: 0</span><span id="hn">Hints: 0</span></div>
      <hr />
      <div class="row">
        <span>Theme</span>
        <div class="seg" id="theme">
          <button data-t="auto">Auto</button><button data-t="light">Light</button
          ><button data-t="dark">Dark</button>
        </div>
      </div>
      <hr />
      <label class="row"><span>Show errors</span><input type="checkbox" id="oErr" checked /></label>
      <label class="row"
        ><span>Auto-clean notes</span><input type="checkbox" id="oClean" checked
      /></label>
      <label class="row"
        ><span>Highlight row/column/box</span><input type="checkbox" id="oPeer" checked
      /></label>
      <label class="row"
        ><span>Highlight matching notes</span><input type="checkbox" id="oTint" checked
      /></label>
      <hr />
      <div class="row">
        <span>Seed <b id="seedText">-</b></span>
        <span class="btns"
          ><button id="copySeed">Copy</button><button id="shareSeed">Share link</button></span
        >
      </div>
      <form id="seedForm" class="row" autocomplete="off">
        <input
          id="seedIn"
          placeholder="Load a seed or link"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
        />
        <button id="loadSeed" type="submit">Load</button>
      </form>
      <div id="seedErr" role="alert" hidden></div>
      <div id="linkBox" hidden>
        <input id="linkOut" readonly aria-label="Share link" />
        <p>Could not copy automatically. Press and hold the link above to copy it.</p>
      </div>
      <hr />
      <button id="trim" class="mb">&#9986; Trim notes</button>
    </div>
    <div id="ov">
      <div class="card">
        <h2>Solved!</h2>
        <p id="ovt"></p>
        <button class="pri" id="ovn">Play again</button><button id="ovc">Close</button>
      </div>
    </div>
    <script src="js/solver.js"></script>
    <script src="js/game.js"></script>
    <script src="js/hints.js"></script>
    <script src="js/history.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Offline support: only on http(s), never on file://
      if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
        addEventListener('load', () =>
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}),
        );
    </script>
  </body>
</html>
